# Camera intrinsics
fast_calib:
  ros__parameters:
    # mid360
    fx: 1497.957147
    fy: 1493.485423
    cx: 971.676063
    cy: 539.433737
    k1: 0.054994
    k2: -0.054911
    p1: -0.001031
    p2: -0.000022
    k3: 0.000000

    # Calibration target parameters
    marker_size: 0.20 # ArUco marker size (our test data uses 0.16m; adjust to match your marker size)
    delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction
    delta_height_qr_center: 0.35 # Half the distance between the centers of two markers in the vertical direction
    delta_width_circles: 0.5 # Distance between the centers of two circles in the horizontal direction
    delta_height_circles: 0.4 # Distance between the centers of two circles in the vertical direction
    circle_radius: 0.12 # Radius of the circle
    # This bag accumulates 73 scans. Reject weakly supported noise voxels.
    min_points_per_voxel: 50
    plane_distance_threshold: 0.02 # Include board returns within 2 cm of its plane.

    # Board bounds in the recorded /rslidar_points coordinates (depth is Z).
    x_min: -0.58801
    x_max: 0.50846
    y_min: -0.69436
    y_max: 0.82626
    z_min: 1.97507
    z_max: 2.07879

    lidar_topic: /rslidar_points #"/livox/lidar" # /ouster/points /livox/points
    # Open this single database directly; its Jazzy metadata.yaml is incompatible with Humble.
    bag_path: "/home/marv/code/calib_lidar/output_db3_dir/output_db3_dir_0.db3"
    image_path: "/home/marv/code/calib_lidar/1.png"

    # Output
    output_path: "/home/marv/code/calib_lidar/result"

    # Add minimum detected markers parameter
    min_detected_markers: 3
