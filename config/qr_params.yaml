# Camera intrinsics
fast_calib:
  ros__parameters:
    # mid360
    fx: 1497.957147
    fy: 1493.485423
    cx: 971.676063
    cy: 539.433737
    k1: 0.054994
    k2: -0.054911
    p1: -0.001031
    p2: -0.000022
    k3: 0.000000

    # Calibration target parameters
    marker_size: 0.20 # ArUco marker size (our test data uses 0.16m; adjust to match your marker size)
    delta_width_qr_center: 0.55 # Half the distance between the centers of two markers in the horizontal direction
    delta_height_qr_center: 0.35 # Half the distance between the centers of two markers in the vertical direction
    delta_width_circles: 0.5 # Distance between the centers of two circles in the horizontal direction
    delta_height_circles: 0.4 # Distance between the centers of two circles in the vertical direction
    circle_radius: 0.12 # Radius of the circle
    # Hole detection (distances in meters). These are algorithm thresholds, not bag-specific fits.
    min_lidar_holes: 3            # 3 or 4 observed centers; prefer 4 when available.
    circle_min_inliers: 20        # Points supporting each circle (not the number of holes).
    circle_fit_distance: 0.01     # RANSAC distance to the circumference.
    circle_radius_tolerance: 0.02 # Allowed radius and mean fit error.
    hole_geometry_tolerance: 0.03 # Pair-distance error for rectangle/triangle checks.
    hole_max_interior_density: 0.05 # Inside/board density ratio; larger is more permissive.
    hole_max_interior_points: 2   # Isolated interior points allowed regardless of density.
    hole_min_surround_sectors: 6  # Required board sectors out of 8.
    hole_max_angular_gap_deg: 180.0 # Largest unsupported gap around the rim.
    boundary_search_radius: 0.0   # 0 = automatic from circle_radius; >0 overrides radius.
    edge_cluster_tolerance: 0.0   # 0 = half boundary radius; >0 connects wider gaps.
    max_mounting_rotation_deg: 45.0 # Resolve corner ambiguity using the known mounting; <90.
    # Reject weakly supported voxels; reduce for shorter/sparser recordings.
    min_points_per_voxel: 50
    plane_distance_threshold: 0.02 # Include board returns within 2 cm of its plane.

    # Board bounds in the recorded /rslidar_points coordinates (depth is Z).
    x_min: -0.51582
    x_max: 0.44936
    y_min: -0.64569
    y_max: 0.75975
    z_min: 1.49279
    z_max: 2.12866

    lidar_topic: /rslidar_points #"/livox/lidar" # /ouster/points /livox/points
    # Open this single database directly; its Jazzy metadata.yaml is incompatible with Humble.
    bag_path: "/home/marv/code/calib_lidar/output_db3_dir_left_side/output_db3_dir_0.db3"
    image_path: "/home/marv/code/calib_lidar/2.png"

    # Output
    output_path: "/home/marv/code/calib_lidar/result2"

    # Add minimum detected markers parameter
    min_detected_markers: 3
